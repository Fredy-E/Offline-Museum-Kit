<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offline Museum Kit</title><style>:root{color-scheme:dark;--bg:#080e19;--panel:#101a2b;--border:#263957;--text:#dce6f8;--muted:#95a8c8;--accent:#72adff;--blue:#266deb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 'Segoe UI',system-ui,sans-serif}main{max-width:1240px;margin:auto;padding:38px 28px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:25px}h1{font-size:43px;font-weight:650;letter-spacing:-1.6px;margin:0}h2{font-size:24px;letter-spacing:-.6px}h3{font-size:18px}p{margin:8px 0 16px}.eyebrow{font:11px Consolas,monospace;letter-spacing:2.6px;color:var(--accent);margin-bottom:10px}.subtitle{color:var(--muted);font-size:17px}.icon{display:grid;place-items:center;flex:0 0 64px;height:64px;border:1px solid #315488;border-radius:15px;background:linear-gradient(135deg,#194084,#0f203c);color:#92bdff;font-size:23px;letter-spacing:-1px;font-weight:700}.chip{font-size:11px;letter-spacing:.5px;font-weight:400;vertical-align:middle;margin-left:15px;padding:4px 8px;border:1px solid var(--border);border-radius:5px;color:var(--muted)}a{color:var(--accent)}button,.button,select,input,textarea{font:inherit}button,.button{display:inline-block;padding:9px 16px;border:1px solid #324c73;border-radius:7px;color:var(--text);background:#172740;cursor:pointer;line-height:1.45;text-decoration:none}button:hover,.button:hover{border-color:var(--accent);background:#213854}button:disabled{opacity:.5;cursor:default}.primary{background:#2364d7;border-color:#3c7bf0;color:white}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:20px 0}.notice{background:var(--panel);padding:12px 16px;border-left:3px solid var(--blue);border-radius:0 7px 7px 0;color:var(--muted);font-size:14px;white-space:pre-wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.stats>div{padding:18px 20px;background:var(--panel);border:1px solid var(--border);border-radius:9px}.stats b{display:block;font-size:27px;font-weight:650;color:#d7e8ff}.stats span{font-size:12px;color:var(--muted)}input,select,textarea{border:1px solid var(--border);border-radius:7px;background:#111d30;color:var(--text);padding:9px 12px}input::placeholder,textarea::placeholder{color:#8094b4}.filters{display:flex;gap:10px;flex-wrap:wrap}.filters input{flex:1;min-width:200px}.meta{color:var(--muted);font-size:12px;margin-top:17px}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:9px}table{border-collapse:collapse;width:100%;font-size:14px}th{text-align:left;background:#14243b;color:var(--muted);font-size:12px;font-weight:500}td,th{padding:14px 16px;border-bottom:1px solid var(--border);vertical-align:top}tr:last-child td{border-bottom:0}td strong{font-weight:600}small{display:block;color:var(--muted);font-size:12px;margin-top:4px}.badge{display:inline-block;font-size:11px;padding:3px 8px;background:#162d4e;border:1px solid #335686;color:#9ac6ff;border-radius:5px}.warn{background:#332b1b;border-color:#66532b;color:#f2cc89}details{font-size:12px;color:var(--muted)}summary{cursor:pointer;margin:8px 0;color:var(--accent)}.explain{font-size:14px;margin-top:25px;padding:14px 18px;border:1px solid var(--border);border-radius:8px}.explain p{max-width:920px}footer{margin-top:35px;border-top:1px solid var(--border);padding-top:18px;color:#748aac;font-size:12px}.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:22px}.panel h2{margin-top:0}textarea{width:100%;min-height:250px;resize:vertical;font:13px/1.7 Consolas,monospace}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.result-grid ul{padding-left:20px;overflow-wrap:anywhere}canvas{display:block;width:100%;border:1px solid var(--border);border-radius:10px;background:#0b1 .exhibit{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(220px,1fr);gap:22px}.stage{position:relative}#canvas{height:430px}.captions{margin-top:28px}.captions article{padding:18px 0;border-top:1px solid var(--border)}@media(max-width:760px){.exhibit{display:block}#canvas{height:320px}}@media print{body{background:white;color:black}canvas,.toolbar,.icon,.notice{display:none}.exhibit{display:block}.panel{background:white;color:black;border:1px solid #aaa}.captions article{break-inside:avoid}footer{color:black}}</style></head><body><main><header><div><p class="eyebrow">FREDY-E / PORTABLE EXPERIENCES</p><h1>Offline Museum Kit</h1><p class="subtitle" id="intro"></p></div><span class="icon">OM</span></header><div class="exhibit"><section class="stage"><canvas id="canvas" aria-label="Procedural 3D exhibit"></canvas><p class="meta">← → arrow keys move between exhibits. All captions remain readable below.</p></section><section class="panel"><p class="eyebrow" id="step"></p><h2 id="title"></h2><p id="description"></p><div class="toolbar"><button id="previous">Previous</button><button class="primary" id="next">Next</button></div><div id="dots" class="toolbar"></div><button id="print">Print exhibit</button></section></div><p class="notice" id="message" role="status">A fictional exhibition, built from formulas. This page works offline.</p><section class="captions" id="captions"></section><footer>Offline Museum Kit · One HTML file · WebGL2 with readable fallback</footer></main><script>(function(root){
function surface(type,segments=32,rings=16){segments=Math.max(3,Math.min(128,Math.floor(segments)));rings=Math.max(2,Math.min(64,Math.floor(rings)));const positions=[],normals=[],indices=[];
for(let j=0;j<=rings;j++)for(let i=0;i<=segments;i++){const u=i/segments*2*Math.PI,v=j/rings;let p,n;
if(type==='sphere'){const t=v*Math.PI;n=[Math.sin(t)*Math.cos(u),Math.cos(t),Math.sin(t)*Math.sin(u)];p=n;}
else if(type==='torus'){const t=v*2*Math.PI;n=[Math.cos(t)*Math.cos(u),Math.sin(t),Math.cos(t)*Math.sin(u)];p=[(1+.34*Math.cos(t))*Math.cos(u),.34*Math.sin(t),(1+.34*Math.cos(t))*Math.sin(u)];}
else if(type==='cylinder'){p=[Math.cos(u),2*v-1,Math.sin(u)];n=[Math.cos(u),0,Math.sin(u)];}
else throw Error('Unknown surface');positions.push(...p);normals.push(...n);}
for(let j=0;j<rings;j++)for(let i=0;i<segments;i++){const a=j*(segments+1)+i,b=a+segments+1;indices.push(a,b,a+1,a+1,b,b+1);}
if(type==='sphere'){for(let i=0;i<indices.length;i+=3){const t=indices[i+1];indices[i+1]=indices[i+2];indices[i+2]=t;}}
if(type==='cylinder'){for(const top of [false,true]){const center=positions.length/3;positions.push(0,top?1:-1,0);normals.push(0,top?1:-1,0);for(let i=0;i<=segments;i++){const u=i/segments*2*Math.PI;positions.push(Math.cos(u),top?1:-1,Math.sin(u));normals.push(0,top?1:-1,0);}for(let i=0;i<segments;i++)top?indices.push(center,center+i+2,center+i+1):indices.push(center,center+i+1,center+i+2);}}
return{positions,normals,indices};}
function obj(mesh){const lines=['# MeshLab Mini procedural export'];for(let i=0;i<mesh.positions.length;i+=3)lines.push('v '+mesh.positions.slice(i,i+3).join(' '));for(let i=0;i<mesh.normals.length;i+=3)lines.push('vn '+mesh.normals.slice(i,i+3).join(' '));for(let i=0;i<mesh.indices.length;i+=3)lines.push('f '+mesh.indices.slice(i,i+3).map(x=>`${x+1}//${x+1}`).join(' '));return lines.join('\n');}
const api={surface,obj};if(typeof module!=='undefined')module.exports=api;else root.MeshGeometry=api;
})(typeof window!=='undefined'?window:globalThis);
</script><script>(function(root){
function matmul(a,b){const r=new Float32Array(16);for(let c=0;c<4;c++)for(let row=0;row<4;row++)for(let k=0;k<4;k++)r[c*4+row]+=a[k*4+row]*b[c*4+k];return r;}
function perspective(aspect){const f=1/Math.tan(Math.PI/7),near=.1,far=100;return new Float32Array([f/aspect,0,0,0,0,f,0,0,0,0,(far+near)/(near-far),-1,0,0,2*far*near/(near-far),0]);}
function transform(azimuth,elevation,distance){const c=Math.cos(azimuth),s=Math.sin(azimuth),ce=Math.cos(elevation),se=Math.sin(elevation);const y=new Float32Array([c,0,-s,0,0,1,0,0,s,0,c,0,0,0,0,1]);const x=new Float32Array([1,0,0,0,0,ce,se,0,0,-se,ce,0,0,0,-distance,1]);return matmul(x,y);}
function create(canvas){const gl=canvas.getContext('webgl2',{antialias:true});if(!gl)throw Error('WebGL2 is unavailable. The mesh can still be generated and exported.');const vertex=`#version 300 es\n in vec3 position;in vec3 normal;uniform mat4 matrix;out vec3 N;void main(){N=normal;gl_Position=matrix*vec4(position,1.);}`;const fragment=`#version 300 es\nprecision highp float;in vec3 N;uniform bool normalColor;out vec4 color;void main(){vec3 n=normalize(N);float light=.28+.72*max(dot(n,normalize(vec3(.6,.9,1.))),0.);vec3 base=normalColor?n*.5+.5:vec3(.2,.48,.95)*light;color=vec4(base,1.);}`;
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vertex));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fragment));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);const vao=gl.createVertexArray();gl.bindVertexArray(vao);const pos=gl.createBuffer(),nor=gl.createBuffer(),tri=gl.createBuffer(),lines=gl.createBuffer();for(const [name,buffer]of[['position',pos],['normal',nor]]){gl.bindBuffer(gl.ARRAY_BUFFER,buffer);const loc=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,3,gl.FLOAT,false,0,0);}let triangleCount=0,lineCount=0;return{update(mesh){gl.bindBuffer(gl.ARRAY_BUFFER,pos);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(mesh.positions),gl.STATIC_DRAW);gl.bindBuffer(gl.ARRAY_BUFFER,nor);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(mesh.normals),gl.STATIC_DRAW);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,tri);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint32Array(mesh.indices),gl.STATIC_DRAW);triangleCount=mesh.indices.length;const edge=[];const seen=new Set();for(let i=0;i<mesh.indices.length;i+=3)for(const [a,b]of[[mesh.indices[i],mesh.indices[i+1]],[mesh.indices[i+1],mesh.indices[i+2]],[mesh.indices[i+2],mesh.indices[i]]]){const k=Math.min(a,b)+':'+Math.max(a,b);if(!seen.has(k)){seen.add(k);edge.push(a,b)}}gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,lines);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint32Array(edge),gl.STATIC_DRAW);lineCount=edge.length;},draw({azimuth=.5,elevation=.4,distance=4,wireframe=false,normalColor=false}={}){const width=Math.round(canvas.clientWidth*Math.min(devicePixelRatio,2)),height=Math.round(canvas.clientHeight*Math.min(devicePixelRatio,2));if(canvas.width!==width||canvas.height!==height){canvas.width=width;canvas.height=height}gl.viewport(0,0,width,height);gl.clearColor(.025,.045,.085,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.useProgram(program);gl.bindVertexArray(vao);gl.uniformMatrix4fv(gl.getUniformLocation(program,'matrix'),false,matmul(perspective(width/height),transform(azimuth,elevation,distance)));gl.uniform1i(gl.getUniformLocation(program,'normalColor'),normalColor);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,wireframe?lines:tri);gl.drawElements(wireframe?gl.LINES:gl.TRIANGLES,wireframe?lineCount:triangleCount,gl.UNSIGNED_INT,0);}};}
root.MeshRenderer={create};
})(typeof window!=='undefined'?window:globalThis);
</script><script>
const exhibit={"title": "A small museum of forms", "description": "A fictional exhibit demonstrating a portable guided 3D template.", "items": [{"title": "The sphere", "description": "A continuous surface generated from latitude and longitude. This fictional exhibit introduces the geometry of a rounded form.", "shape": "sphere", "x": -3}, {"title": "The torus", "description": "A ring generated from two circular parameters. Its repeating topology creates a surface with a central opening.", "shape": "torus", "x": 0}, {"title": "The cylinder", "description": "A circular wall capped at both ends. A simple procedural building block for tools, architecture, and exhibits.", "shape": "cylinder", "x": 3}]};const $=x=>document.getElementById(x);$('intro').textContent=exhibit.description;let selected=0,renderer;let mesh;function build(item){const model=MeshGeometry.surface(item.shape,48,24);const positions=[];for(let i=0;i<model.positions.length;i+=3)positions.push(model.positions[i]*.82,model.positions[i+1]*.82+.28,model.positions[i+2]*.82);return{...model,positions}};try{renderer=MeshRenderer.create($('canvas'))}catch(error){$('message').textContent='3D rendering is unavailable. All exhibit captions and navigation still work.';$('canvas').hidden=true;}
exhibit.items.forEach((item,index)=>{const article=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p');h.textContent=item.title;p.textContent=item.description;article.append(h,p);$('captions').append(article);const button=document.createElement('button');button.textContent=index+1;button.setAttribute('aria-label','Go to '+item.title);button.onclick=()=>show(index);$('dots').append(button)});function show(index){selected=Math.max(0,Math.min(exhibit.items.length-1,index));const item=exhibit.items[selected];$('step').textContent=`EXHIBIT ${selected+1} / ${exhibit.items.length}`;$('title').textContent=item.title;$('description').textContent=item.description;$('previous').disabled=selected===0;$('next').disabled=selected===exhibit.items.length-1;Array.from($('dots').children).forEach((b,i)=>{b.classList.toggle('primary',i===selected);b.setAttribute('aria-pressed',String(i===selected))});mesh=build(item);renderer?.update(mesh);draw();}function draw(){renderer?.draw({azimuth:[.45,.8,.6][selected]||.5,elevation:[.25,.75,.4][selected]||.4,distance:3.8})}$('previous').onclick=()=>show(selected-1);$('next').onclick=()=>show(selected+1);$('print').onclick=()=>window.print();window.addEventListener('keydown',event=>{if(['INPUT','TEXTAREA','SELECT'].includes(event.target.tagName))return;if(event.key==='ArrowRight'){event.preventDefault();show(selected+1)}if(event.key==='ArrowLeft'){event.preventDefault();show(selected-1)}});window.addEventListener('resize',draw);show(0);
</script></body></html>
